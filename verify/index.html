<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recoup — /verify decision replay</title>
<style>
  :root{
    --ink:#0A1E30; --panel:#0F2A43; --panel-2:#123350; --line:#1F3E5A; --line-2:#28486a;
    --emerald:#10B981; --emerald-dim:#0e9d70; --mint:#2DD4BF; --amber:#F0B429; --red:#EF4444;
    --text:#E9F2F7; --text-2:#B7CBDA; --muted:#82A0B4; --muted-2:#5f7d92;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --r:14px; --r-sm:9px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 620px at 82% -8%, rgba(45,212,191,.10), transparent 60%),
      radial-gradient(1000px 560px at 8% 4%, rgba(16,185,129,.10), transparent 55%),
      var(--ink);
    color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5; letter-spacing:.1px;
  }
  .page{max-width:1360px; margin:0 auto; padding:30px 26px 64px}
  a{color:var(--mint); text-decoration:none}
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.2px}
  .mono{font-family:var(--mono)}
  .hash{font-family:var(--mono); font-size:11.5px; color:var(--muted)}

  /* ---------- header ---------- */
  header#hero{display:flex; flex-wrap:wrap; gap:18px 26px; align-items:flex-start; justify-content:space-between; padding-bottom:22px; border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:center; gap:14px}
  .glyph{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(145deg,var(--emerald),var(--mint)); color:#062018; box-shadow:0 8px 26px rgba(16,185,129,.34); flex:0 0 auto}
  .brand h1{font-size:23px}
  .brand .sub{color:var(--muted); font-size:13px; margin-top:3px}
  .brand .sub b{color:var(--text-2); font-weight:600}
  .hero-right{display:flex; flex-direction:column; align-items:flex-end; gap:9px}
  .badge{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line-2); background:var(--panel)}
  .badge.fixture{color:#12222c; background:linear-gradient(180deg,#f6c65a,var(--amber)); border-color:transparent}
  .badge.ok{color:var(--emerald)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .case-line{color:var(--muted); font-size:12.5px; text-align:right}
  .case-line b{color:var(--text-2)}

  /* ---------- counters ---------- */
  .counters{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:26px 0 8px}
  .tile{background:linear-gradient(180deg,var(--panel),#0d2439); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; position:relative; overflow:hidden}
  .tile .k{font-size:11.5px; letter-spacing:.10em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .tile .v{font-size:34px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; letter-spacing:-1px}
  .tile .foot{font-size:11.5px; color:var(--muted-2); margin-top:6px}
  .tile.rec .v{background:linear-gradient(120deg,var(--emerald),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .tile.viol{border-color:rgba(16,185,129,.5); box-shadow:0 0 0 1px rgba(16,185,129,.18) inset}
  .tile.viol .v{color:var(--emerald); display:flex; align-items:center; gap:12px}
  .tile.viol.breach{border-color:rgba(239,68,68,.6)} .tile.viol.breach .v{color:var(--red)}
  .tile .check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(16,185,129,.16);border:1.5px solid var(--emerald);font-size:16px}

  /* ---------- section frames ---------- */
  section.frame{margin-top:26px; background:rgba(15,42,67,.55); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .frame > .head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); background:rgba(10,30,48,.5)}
  .frame > .head h2{font-size:15px}
  .frame > .head .note{color:var(--muted); font-size:12px}
  .frame > .body{padding:22px}

  /* ---------- split screen ---------- */
  .split{display:grid; grid-template-columns:1fr 1.15fr; gap:0}
  .split .col{padding:22px}
  .split .col.left{border-right:1px solid var(--line); background:rgba(10,26,42,.35)}
  .col .col-title{display:flex; align-items:center; gap:9px; font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:16px}
  .col .col-title .pip{width:8px;height:8px;border-radius:50%}
  .pip.blue{background:#5fa8ff} .pip.em{background:var(--emerald)}

  /* email thread */
  .mail{border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:13px; background:var(--panel)}
  .mail.debtor{margin-left:26px; background:#0c2135; border-color:var(--line-2)}
  .mail.agent{margin-right:26px}
  .mail.hi{border-color:var(--mint); box-shadow:0 0 0 1px rgba(45,212,191,.35), 0 10px 30px rgba(0,0,0,.28)}
  .mail .mh{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px}
  .who{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700}
  .who .av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800}
  .agent .av{background:linear-gradient(145deg,var(--emerald),var(--mint));color:#062018}
  .debtor .av{background:#20415c;color:#bcd6ea}
  .mail .day{font-size:11px;color:var(--muted-2);font-family:var(--mono)}
  .mail .subj{font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:5px}
  .mail .body{font-size:13px;color:var(--text-2);line-height:1.55}
  .mail.hi .body{color:var(--text)}
  .reply-tag{display:inline-block;margin:2px 0 12px 26px;font-size:11px;color:var(--mint);font-weight:600}
  .reply-tag::before{content:"↳ "}

  /* ledger stream */
  .stream{display:flex; flex-direction:column; gap:9px}
  .drow{position:relative; border:1px solid var(--line); border-left:3px solid var(--line-2); border-radius:10px; padding:10px 13px 10px 14px; background:var(--panel); opacity:1}
  .drow.key{border-left-color:var(--emerald); background:linear-gradient(90deg,rgba(16,185,129,.08),rgba(15,42,67,.2))}
  .drow.crit{border-left-color:var(--mint)}
  .drow.money{border-left-color:var(--emerald); background:linear-gradient(90deg,rgba(16,185,129,.13),rgba(15,42,67,.2))}
  .drow .r1{display:flex; align-items:center; gap:9px}
  .seq{font-family:var(--mono); font-size:11px; color:var(--muted-2); min-width:26px}
  .chip{font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:2px 8px; border-radius:6px; background:#183050; color:var(--text-2); border:1px solid var(--line-2)}
  .chip.em{background:rgba(16,185,129,.16); color:var(--emerald); border-color:rgba(16,185,129,.4)}
  .chip.mint{background:rgba(45,212,191,.14); color:var(--mint); border-color:rgba(45,212,191,.4)}
  .chip.blue{background:rgba(95,168,255,.14); color:#8fc0ff; border-color:rgba(95,168,255,.35)}
  .drow .title{font-size:13px; font-weight:650; color:var(--text)}
  .drow .detail{font-size:11.5px; color:var(--muted); margin-top:5px; margin-left:35px; line-height:1.5}
  .drow .h{margin-left:auto}

  @media (prefers-reduced-motion: no-preference){
    .drow{animation:slidein .5s cubic-bezier(.2,.7,.3,1) both; animation-delay:calc(var(--i,0) * 75ms)}
    @keyframes slidein{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
  }

  /* ---------- money shot ---------- */
  .money-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:22px}
  .shot{border:1px solid rgba(16,185,129,.45); border-radius:14px; padding:20px; background:linear-gradient(180deg,rgba(16,185,129,.12),rgba(15,42,67,.35))}
  .shot .lead{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--emerald); font-weight:700}
  .shot .big{font-size:26px; font-weight:800; margin:9px 0 3px; letter-spacing:-.5px}
  .shot .big .amt{background:linear-gradient(120deg,var(--emerald),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .causal{margin-top:16px; border-top:1px dashed var(--line-2); padding-top:14px}
  .causal .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:9px}
  .link-node{display:flex; align-items:center; gap:10px; font-size:12.5px; padding:7px 0; color:var(--text-2)}
  .link-node .ic{width:22px;height:22px;border-radius:6px;background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.4);display:grid;place-items:center;font-size:11px;color:var(--mint);flex:0 0 auto}
  .link-node .lh{margin-left:auto}
  .plan-card{border:1px solid var(--line); border-radius:14px; padding:20px; background:var(--panel)}
  .plan-card h3{font-size:13px; color:var(--text-2); margin-bottom:14px; font-weight:650}
  .inst{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .inst:last-child{border-bottom:0}
  .inst .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(16,185,129,.18);color:var(--emerald);border:1px solid rgba(16,185,129,.4);flex:0 0 auto}
  .inst .amt{font-weight:700; font-variant-numeric:tabular-nums}
  .inst .meta{font-size:11.5px; color:var(--muted); margin-left:auto; text-align:right}
  .inst .paid{color:var(--emerald); font-weight:700; font-size:11.5px}

  /* ---------- two column: simulator + verify ---------- */
  .two{display:grid; grid-template-columns:1.05fr .95fr; gap:22px; margin-top:26px}
  .two > section.frame{margin-top:0}
  .meter{margin:6px 0 20px}
  .meter .mtop{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .meter .pct{font-size:30px; font-weight:800; letter-spacing:-1px; background:linear-gradient(120deg,var(--emerald),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .meter .cap{font-size:12px; color:var(--muted)}
  .track{height:12px; border-radius:999px; background:#0b2135; border:1px solid var(--line); overflow:hidden}
  .fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--emerald-dim),var(--mint))}
  .simstats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px}
  .simstat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; text-align:center}
  .simstat .v{font-size:20px; font-weight:800} .simstat .k{font-size:11px; color:var(--muted); margin-top:3px}
  .simstat.zero .v{color:var(--emerald)}
  .ptable{width:100%; border-collapse:collapse; font-size:12px}
  .ptable th{text-align:left; color:var(--muted); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; padding:7px 8px; border-bottom:1px solid var(--line)}
  .ptable td{padding:7px 8px; border-bottom:1px solid rgba(31,62,90,.5); color:var(--text-2)}
  .ptable td.r{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:11px}
  .state-pill{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px}
  .state-pill.PAID{background:rgba(16,185,129,.16); color:var(--emerald)}
  .state-pill.OPTED_OUT{background:rgba(95,168,255,.14); color:#8fc0ff}
  .state-pill.WRITEOFF_RECOMMENDED{background:#3a2a12; color:var(--amber)}
  .state-pill.CLIENT{background:#2a2140; color:#b79bff}
  .v0{color:var(--emerald); font-weight:700}

  .merkle{border:1px solid var(--line); border-radius:10px; background:#0b2135; padding:14px 16px; margin-bottom:16px}
  .merkle .mrow{display:flex; gap:12px; align-items:baseline; padding:5px 0; font-family:var(--mono); font-size:11px}
  .merkle .mrow .d{color:var(--mint); min-width:92px} .merkle .mrow .rt{color:var(--muted); word-break:break-all}
  .cmd{display:flex; align-items:center; gap:10px; background:#07131f; border:1px solid var(--line-2); border-radius:9px; padding:11px 14px; font-family:var(--mono); font-size:13px; color:var(--text)}
  .cmd .p{color:var(--emerald)}
  .vnote{font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.55}
  .vnote b{color:var(--text-2)}
  .vkpi{display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap}
  .vkpi div{font-size:12px; color:var(--muted)} .vkpi div b{display:block; font-size:17px; color:var(--text); font-family:var(--mono); margin-top:2px}
  .vkpi div.ok b{color:var(--emerald)}

  footer{margin-top:34px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted-2); font-size:12px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between}
  footer .disc{max-width:760px; line-height:1.55}
  footer .fmeta{display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:12px}
  .repo-link{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:8px;
    border:1px solid var(--line-2); background:var(--panel); color:var(--text-2); font-weight:600;
    transition:color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease}
  .repo-link:hover{color:var(--mint); border-color:rgba(45,212,191,.55); background:rgba(45,212,191,.10);
    transform:translateY(-1px); box-shadow:0 6px 18px rgba(45,212,191,.16)}
  .repo-link:focus-visible{outline:2px solid var(--mint); outline-offset:2px; color:var(--mint)}
  .repo-link:active{transform:translateY(0) scale(.985)}
  @media (prefers-reduced-motion: reduce){ .repo-link{transition:none} .repo-link:hover{transform:none} }

  @media (max-width:1080px){
    .counters{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr}
    .split .col.left{border-right:0; border-bottom:1px solid var(--line)}
    .money-grid,.two{grid-template-columns:1fr} .simstats{grid-template-columns:repeat(3,1fr)}
  }

  /* Grid/flex children default to min-width:auto, so the long fixture payment
     URLs and 64-char hashes blow their track out past the viewport. Pin the
     tracks to 0 and let the unbreakable strings wrap instead. */
  .split .col,.money-grid > *,.two > *,.stream,.drow,.mail,.link-node,.merkle .mrow{min-width:0}
  .mail .body,.mail .subj,.drow .title,.drow .detail,.hash,.merkle .mrow .rt,.cmd{overflow-wrap:anywhere}
  .ptable-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}

  @media (max-width:640px){
    .page{padding:22px 14px 52px}
    .counters{grid-template-columns:1fr}
    .simstats{grid-template-columns:1fr}
    .frame > .body,.split .col{padding:16px}
    .tile .v{font-size:28px}
    .shot .big{font-size:22px}
    .mail.debtor{margin-left:12px} .mail.agent{margin-right:12px}
    .reply-tag{margin-left:12px}
    .drow .detail{margin-left:0}
    header#hero{gap:14px} .hero-right{align-items:flex-start} .case-line{text-align:left}
    footer{gap:10px} footer .fmeta{align-items:flex-start}
  }
</style>
</head>

    var chipCls = 'chip'+(chip?(' '+chip):'');
    return '<div class="drow '+cls+'" style="--i:'+i+'">'+
        '<div class="r1"><span class="seq">#'+String(d.seq).padStart(2,'0')+'</span>'+
        '<span class="'+chipCls+'">'+esc(d.kind)+'</span>'+
        '<span class="title">'+esc(d.title)+'</span>'+
        '<span class="hash h">'+sh(d.entryHash)+'</span></div>'+
        (d.detail ? '<div class="detail">'+esc(d.detail)+'</div>' : '')+
      '</div>';
  }).join('');

  var split =
    '<section class="frame" id="splitscreen">'+
      '<div class="head"><h2>The magic moment — a debtor’s reply, and the bounded decision it produced</h2>'+
      '<span class="note">left: the email thread · right: the signed decision ledger</span></div>'+
      '<div class="split">'+
        '<div class="col left" id="thread"><div class="col-title"><span class="pip blue"></span>The thread</div>'+mails+'</div>'+
        '<div class="col" id="ledger"><div class="col-title"><span class="pip em"></span>The decision ledger</div><div class="stream">'+rows+'</div></div>'+
      '</div>'+
    '</section>';

  // ---- money shot ----
  var i1 = (M.installments||[])[0] || {};
  var refTitles = (i1.decisionRefs||[]).map(function(h){ return byHash[h]; }).filter(Boolean);
  var causal = refTitles.map(function(d){
    return '<div class="link-node"><span class="ic">↳</span><span>'+esc(d.title)+'</span><span class="hash lh">'+sh(d.entryHash)+'</span></div>';
  }).join('');
  var insts = (M.installments||[]).map(function(x){
    return '<div class="inst"><span class="n">'+x.n+'</span><span class="amt">'+usd(x.amountCents)+'</span>'+
      '<span class="meta"><span class="paid">paid · day '+x.day+'</span><br>fee '+usd(x.feeCents)+' · '+sh(x.feeHash)+'</span></div>';
  }).join('');

  var money =
    '<section class="frame" id="moneyshot">'+
      '<div class="head"><h2>The money shot — payment causally linked to the decision (invariant I5)</h2>'+
      '<span class="note">no human touched this thread</span></div>'+
      '<div class="body"><div class="money-grid">'+
        '<div class="shot">'+
          '<div class="lead">Installment '+(i1.n||1)+' of '+(i1.ofN||3)+' — paid</div>'+
          '<div class="big"><span class="amt">'+usd(i1.amountCents||0)+'</span> landed on day '+(i1.day!=null?i1.day:'—')+'</div>'+
          '<div style="font-size:12.5px;color:var(--text-2)">Fee <b>'+usd(i1.feeCents||0)+'</b> ('+M.feePct+'%) metered only because the money actually landed.</div>'+
          '<div class="causal"><div class="lbl">⟵ caused by this decision chain</div>'+causal+
            '<div class="link-node" style="color:var(--emerald)"><span class="ic" style="background:rgba(16,185,129,.2);border-color:var(--emerald);color:var(--emerald)">$</span><span><b>Payment</b> — '+usd(i1.amountCents||0)+'</span><span class="hash lh">'+sh(i1.paymentHash)+'</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="plan-card"><h3>Plan — 3×'+usd0((M.installments[0]||{}).amountCents||0)+' within the '+POL.floorPct+'% mandate floor</h3>'+insts+
          '<div style="margin-top:14px;font-size:12px;color:var(--muted)">Total recovered <b style="color:var(--emerald)">'+usd(M.recoveredCents)+'</b> · fees '+usd(M.feeCents)+' · every row signed &amp; chained.</div>'+
        '</div>'+
      '</div></div>'+
    '</section>';

  // ---- simulator + verify ----
  var pct = SIM.recoveryRatePct||0;
  var simRows = (SIM.personas||[]).map(function(p){
    return '<tr><td>'+esc(p.persona)+'</td>'+
      '<td><span class="state-pill '+esc(p.finalState)+'">'+esc(p.finalState)+'</span></td>'+
      '<td class="r">'+usd0(p.recoveredCents)+' / '+usd0(p.invoicedCents)+'</td>'+
      '<td class="r"><span class="v0">'+p.executedViolations+'</span></td></tr>';
  }).join('');

  var simulator =
    '<section class="frame" id="simulator">'+
      '<div class="head"><h2>12-persona debtor simulator</h2><span class="note">deterministic sweep · regression harness</span></div>'+
      '<div class="body">'+
        '<div class="meter"><div class="mtop"><span class="pct">'+pct+'%</span><span class="cap">blended recovery across all personas</span></div>'+
          '<div class="track"><div class="fill" style="width:'+Math.max(2,Math.min(100,pct))+'%"></div></div></div>'+
        '<div class="simstats">'+
          '<div class="simstat"><div class="v">'+SIM.resolvedCount+'/'+SIM.total+'</div><div class="k">personas resolved</div></div>'+
          '<div class="simstat zero"><div class="v">'+SIM.policyViolations+'</div><div class="k">policy violations</div></div>'+
          '<div class="simstat"><div class="v">'+(SIM.gateDenials)+'</div><div class="k">gate denials (expected)</div></div>'+
        '</div>'+
        '<div class="ptable-wrap"><table class="ptable"><thead><tr><th>persona</th><th>final state</th><th class="r">recovered / invoiced</th><th class="r">viol.</th></tr></thead><tbody>'+simRows+'</tbody></table></div>'+
        '<div style="margin-top:12px;font-size:11.5px;color:var(--muted)">opt-out honored: <span class="v0">'+(SIM.optOutHonored?'yes':'NO')+'</span> · all ledgers verified: <span class="v0">'+(SIM.allLedgersVerified?'yes':'NO')+'</span> · all expectations met: <span class="v0">'+(SIM.allExpectationsMet?'yes':'NO')+'</span></div>'+
      '</div>'+
    '</section>';

  var mrows = Object.keys(V.merkleRoots||{}).map(function(day){
    return '<div class="mrow"><span class="d">'+esc(day)+'</span><span class="rt">'+esc(V.merkleRoots[day])+'</span></div>';
  }).join('');

  var verify =
    '<section class="frame" id="verify">'+
      '<div class="head"><h2>Verify it yourself</h2><span class="note">standalone from the exported ledger</span></div>'+
      '<div class="body">'+
        '<div class="vkpi"><div class="ok"><span>chain valid</span><b>'+(V.ok?'YES':'NO')+'</b></div>'+
          '<div><span>entries</span><b>'+V.length+'</b></div>'+
          '<div><span>fee rows (I5)</span><b>'+V.feeRowsChecked+'</b></div>'+
          '<div><span>errors</span><b>'+V.errorCount+'</b></div></div>'+
        '<div class="merkle"><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">daily Merkle roots (per UTC day)</div>'+mrows+'</div>'+
        '<div class="cmd"><span class="p">$</span>&nbsp;'+esc(V.command)+'</div>'+
        '<div class="vnote"><b>Why this result is pre-computed:</b> '+esc(V.note)+' Verifier: <b>'+esc(V.verifier)+'</b>.</div>'+
      '</div>'+
    '</section>';

  var footer =
    '<footer><div class="disc"><b style="color:var(--amber)">FIXTURE / offline demo.</b> '+esc(DATA.disclosure)+
      ' No real debtor, client, or invoice appears here and no mailbox was contacted. Fakes stand in for Gmail/Stripe; the classifier is the offline heuristic. Money is integer USD cents end-to-end.</div>'+
      '<div class="fmeta"><a class="repo-link" href="https://github.com/edycutjong/recoup">Source &amp; how to re-verify &#8599;</a>'+
        '<span class="mono" style="color:var(--muted-2)">exported '+esc((DATA.generatedAtIso||'').slice(0,19).replace('T',' '))+'Z</span></div>'+
    '</footer>';

  el('app').innerHTML = header + counters + split + money +
    '<div class="two">'+simulator+verify+'</div>' + footer;
})();
</script>
</body>
</html>
