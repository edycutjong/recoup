name: Release

# Automated semantic versioning driven by Conventional Commits.
#
# release-please maintains a rolling "chore(main): release X.Y.Z" pull request
# that accumulates every conventional commit landed on main. Merging that PR is
# the release: release-please then tags vX.Y.Z, cuts the GitHub Release, and
# writes CHANGELOG.md. Nothing is published to npm — the package is private and
# the release artifact judges care about is the tagged source + changelog.
#
# Baseline was pinned at 1.0.0 in .release-please-manifest.json (matching the
# already-shipped package.json version), so the version line continues rather
# than restarting; the first automated release was 1.1.0.
#
# NOTE on release-please-config.json: `package-name` is deliberately "" and must
# stay that way. release-please derives a tag "component" from the package name,
# and for a scoped name like @recoup/dunningkit-core that component is
# "dunningkit-core". With a single package the release branch is
# `release-please--branches--main`, which carries no component — so at release
# time the strategy compares an empty branch component against
# "dunningkit-core", logs `PR component: undefined does not match configured
# component`, and silently declines to tag the merged release PR. An empty
# package-name makes the derived component empty and the two sides agree. It
# affects nothing else here: package.json and package-lock.json are updated by
# path, and the only consumers of package-name (samples/package.json,
# changelog.json) do not exist in this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two release-please passes concurrently — they would race on the
# release PR branch. Queue instead of cancelling so no commit is skipped.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases, push the release branch
      pull-requests: write # open/update the release PR
    steps:
      # The GitHub REST/GraphQL API returns transient 503s often enough that an
      # unretried single attempt is a coin flip. release-please is idempotent —
      # it reconciles state from the tags and the open release PR — so simply
      # running it again is safe.
      - name: Run release-please (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Back off before retrying
        if: steps.attempt1.outcome == 'failure'
        run: sleep 45

      - name: Run release-please (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Back off before the final attempt
        if: steps.attempt2.outcome == 'failure'
        run: sleep 120

      # Final attempt — not continue-on-error, so three consecutive API
      # failures still turn the job red rather than silently doing nothing.
      - name: Run release-please (attempt 3)
        id: attempt3
        if: steps.attempt2.outcome == 'failure'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarise outcome
        env:
          RELEASED: ${{ steps.attempt1.outputs.release_created || steps.attempt2.outputs.release_created || steps.attempt3.outputs.release_created }}
          TAG: ${{ steps.attempt1.outputs.tag_name || steps.attempt2.outputs.tag_name || steps.attempt3.outputs.tag_name }}
          PR: ${{ steps.attempt1.outputs.pr || steps.attempt2.outputs.pr || steps.attempt3.outputs.pr }}
        run: |
          {
            echo "### release-please"
            if [ "${RELEASED:-false}" = "true" ]; then
              echo "Released **${TAG}**."
            elif [ -n "${PR:-}" ]; then
              echo "Release pull request opened/updated. Merge it to cut the release."
            else
              echo "No releasable conventional commits since the last release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
