<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recoup — /verify decision replay</title>
<style>
  :root{
    --ink:#0A1E30; --panel:#0F2A43; --panel-2:#123350; --line:#1F3E5A; --line-2:#28486a;
    --emerald:#10B981; --emerald-dim:#0e9d70; --mint:#2DD4BF; --amber:#F0B429; --red:#EF4444;
    --text:#E9F2F7; --text-2:#B7CBDA; --muted:#82A0B4; --muted-2:#5f7d92;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
    --r:14px; --r-sm:9px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{scroll-behavior:smooth; scroll-padding-top:78px}
  body{
    background:
      radial-gradient(1200px 620px at 82% -8%, rgba(45,212,191,.10), transparent 60%),
      radial-gradient(1000px 560px at 8% 4%, rgba(16,185,129,.10), transparent 55%),
      var(--ink);
    color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5; letter-spacing:.1px;
  }
  .page{max-width:1360px; margin:0 auto; padding:30px 26px 64px}
  a{color:var(--mint); text-decoration:none}
  h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.2px}
  .mono{font-family:var(--mono)}
  .hash{font-family:var(--mono); font-size:11.5px; color:var(--muted)}

  /* ---------- skip link + sticky nav ---------- */
  .skip{position:absolute; left:-9999px; top:8px; z-index:120; background:var(--emerald); color:#06231a;
    padding:10px 16px; border-radius:10px; font-weight:700; font-size:13px}
  .skip:focus{left:8px}
  .topnav{position:sticky; top:10px; z-index:60; display:flex; align-items:center; gap:8px; min-width:0;
    padding:8px 10px 8px 14px; margin-bottom:26px; border:1px solid var(--line-2); border-radius:999px;
    background:rgba(9,27,44,.9); -webkit-backdrop-filter:blur(12px) saturate(140%); backdrop-filter:blur(12px) saturate(140%);
    box-shadow:0 12px 34px rgba(2,10,18,.5)}
  .topnav .nb{display:flex; align-items:center; gap:9px; font-weight:800; font-size:13.5px; letter-spacing:-.2px; flex:0 0 auto; color:var(--text)}
  .topnav .nb .g{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;font-size:12px;
    background:linear-gradient(145deg,var(--emerald),var(--mint)); color:#062018}
  .topnav .links{display:flex; gap:2px; overflow-x:auto; min-width:0; scrollbar-width:none; margin-left:4px}
  .topnav .links::-webkit-scrollbar{display:none}
  .navlink{white-space:nowrap; font-size:12.5px; font-weight:600; color:var(--text-2); padding:6px 11px; border-radius:999px;
    border:1px solid transparent; transition:color .16s ease, background .16s ease, border-color .16s ease}
  .navlink:hover{color:var(--mint); background:rgba(45,212,191,.10); border-color:rgba(45,212,191,.35)}
  .navlink:focus-visible{outline:2px solid var(--mint); outline-offset:2px; color:var(--mint)}
  .navlink:active{background:rgba(45,212,191,.2)}
  .topnav .nfix{margin-left:auto; flex:0 0 auto}

  /* ---------- hero ---------- */
  header#hero{padding:4px 0 28px; border-bottom:1px solid var(--line)}
  .eyebrow{display:inline-flex; align-items:center; gap:10px; font-size:11px; font-weight:800; letter-spacing:.16em;
    text-transform:uppercase; color:var(--mint); margin-bottom:16px}
  .eyebrow .bar{width:28px; height:2px; border-radius:2px; background:linear-gradient(90deg,var(--emerald),var(--mint)); flex:0 0 auto}
  header#hero h1{font-size:clamp(27px,4.4vw,48px); line-height:1.07; letter-spacing:-1.5px; max-width:16ch}
  header#hero h1 .hl{background:linear-gradient(100deg,var(--emerald),var(--mint) 62%,#7fdcff);
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .lede{margin-top:16px; font-size:clamp(13.5px,1.15vw,16.5px); color:var(--text-2); max-width:70ch; line-height:1.62}
  .lede b{color:var(--text); font-weight:650}
  .hero-cols{display:grid; grid-template-columns:1.4fr .92fr; gap:26px; align-items:start; margin-top:24px}
  .badge{display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px; border:1px solid var(--line-2); background:var(--panel)}
  .badge.fixture{color:#12222c; background:linear-gradient(180deg,#f6c65a,var(--amber)); border-color:transparent}
  .badge.ok{color:var(--emerald)}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor; flex:0 0 auto}
  .case-line{color:var(--muted); font-size:12.5px; margin-top:14px; line-height:1.55}
  .case-line b{color:var(--text-2)}

  /* proof strip — every value traceable to a command in the repo */
  .proofstrip{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:24px}
  .pchip{border:1px solid var(--line); border-radius:12px; min-width:0; padding:13px 15px;
    background:linear-gradient(180deg,rgba(18,51,80,.8),rgba(13,36,57,.8));
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease}
  .pchip:hover{border-color:var(--line-2); transform:translateY(-2px); box-shadow:0 10px 26px rgba(2,10,18,.42)}
  .pchip .pv{font-size:20px; font-weight:800; letter-spacing:-.5px; font-variant-numeric:tabular-nums; color:var(--text)}
  .pchip .pv small{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:0}
  .pchip .pk{font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4}
  .pchip .src{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:6px; display:block}
  .pchip.em .pv{color:var(--emerald)}

  /* honesty card — the disclosure IS the thesis, so it is designed, not buried */
  .honest{border:1px solid rgba(240,180,41,.42); border-radius:14px; padding:17px 19px; min-width:0;
    background:linear-gradient(180deg,rgba(240,180,41,.11),rgba(15,42,67,.45))}
  .honest h2{font-size:11.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--amber); margin-bottom:12px}
  .honest ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
  .honest li{font-size:12.5px; color:var(--text-2); display:flex; gap:9px; align-items:flex-start; line-height:1.45}
  .honest li .x{color:var(--amber); font-weight:800; flex:0 0 auto; font-family:var(--mono)}
  .honest .fine{margin-top:12px; padding-top:11px; border-top:1px dashed rgba(240,180,41,.3);
    font-size:11.5px; color:var(--muted); line-height:1.5}
  .honest .fine b{color:var(--text-2)}

  /* ---------- gate rail ---------- */
  .gates{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px}
  .gate{flex:1 1 168px; min-width:0; border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:13px 15px;
    transition:border-color .18s ease, transform .18s ease}
  .gate:hover{border-color:var(--line-2); transform:translateY(-2px)}
  .gate .gi{font-size:10.5px; font-weight:800; letter-spacing:.12em; color:var(--muted); font-family:var(--mono)}
  .gate .gn{font-size:13px; font-weight:700; margin-top:5px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .gate .gn .ct{font-size:11px; font-weight:800; color:var(--emerald); font-family:var(--mono)}
  .gate .gd{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.45; overflow-wrap:anywhere}
  .gate.stop{border-color:rgba(16,185,129,.45); background:linear-gradient(180deg,rgba(16,185,129,.13),var(--panel))}

  /* ---------- counters ---------- */
  .counters{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:26px 0 8px}
  .tile{background:linear-gradient(180deg,var(--panel),#0d2439); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; position:relative; overflow:hidden; min-width:0;
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease}
  .tile:hover{border-color:var(--line-2); transform:translateY(-2px); box-shadow:0 14px 32px rgba(2,10,18,.45)}
  .tile::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .22s ease;
    background:radial-gradient(360px 150px at 80% -30%, rgba(45,212,191,.16), transparent 70%)}
  .tile:hover::after{opacity:1}
  .tile .k{font-size:11.5px; letter-spacing:.10em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .tile .v{font-size:34px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; letter-spacing:-1px}
  .tile .foot{font-size:11.5px; color:var(--muted-2); margin-top:6px}
  .tile.rec .v{background:linear-gradient(120deg,var(--emerald),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .tile.viol{border-color:rgba(16,185,129,.5); box-shadow:0 0 0 1px rgba(16,185,129,.18) inset}
  .tile.viol .v{color:var(--emerald); display:flex; align-items:center; gap:12px}
  .tile.viol.breach{border-color:rgba(239,68,68,.6)} .tile.viol.breach .v{color:var(--red)}
  .tile .check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(16,185,129,.16);border:1.5px solid var(--emerald);font-size:16px}

  /* ---------- section frames ---------- */
  section.frame{margin-top:26px; background:rgba(15,42,67,.55); border:1px solid var(--line); border-radius:18px; overflow:hidden}
  .frame > .head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); background:rgba(10,30,48,.5)}
  .frame > .head h2{font-size:15px}
  .frame > .head .note{color:var(--muted); font-size:12px}
  .frame > .body{padding:22px}

  /* ---------- split screen ---------- */
  .split{display:grid; grid-template-columns:1fr 1.15fr; gap:0}
  .split .col{padding:22px}
  .split .col.left{border-right:1px solid var(--line); background:rgba(10,26,42,.35)}
  .col .col-title{display:flex; align-items:center; gap:9px; font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:16px}
  .col .col-title .pip{width:8px;height:8px;border-radius:50%}
  .pip.blue{background:#5fa8ff} .pip.em{background:var(--emerald)}

  /* email thread */
  .mail{border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-bottom:13px; background:var(--panel)}
  .mail.debtor{margin-left:26px; background:#0c2135; border-color:var(--line-2)}
  .mail.agent{margin-right:26px}
  .mail.hi{border-color:var(--mint); box-shadow:0 0 0 1px rgba(45,212,191,.35), 0 10px 30px rgba(0,0,0,.28)}
  .mail .mh{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:7px}
  .who{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700}
  .who .av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800}
  .agent .av{background:linear-gradient(145deg,var(--emerald),var(--mint));color:#062018}
  .debtor .av{background:#20415c;color:#bcd6ea}
  .mail .day{font-size:11px;color:var(--muted-2);font-family:var(--mono)}
  .mail .subj{font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:5px}
  .mail .body{font-size:13px;color:var(--text-2);line-height:1.55}
  .mail.hi .body{color:var(--text)}
  .reply-tag{display:inline-block;margin:2px 0 12px 26px;font-size:11px;color:var(--mint);font-weight:600}
  .reply-tag::before{content:"↳ "}

  /* ledger stream */
  .stream{display:flex; flex-direction:column; gap:9px}
  .drow{position:relative; border:1px solid var(--line); border-left:3px solid var(--line-2); border-radius:10px; padding:10px 13px 10px 14px; background:var(--panel); opacity:1}
  .drow.key{border-left-color:var(--emerald); background:linear-gradient(90deg,rgba(16,185,129,.08),rgba(15,42,67,.2))}
  .drow.crit{border-left-color:var(--mint)}
  .drow.money{border-left-color:var(--emerald); background:linear-gradient(90deg,rgba(16,185,129,.13),rgba(15,42,67,.2))}
  .drow .r1{display:flex; align-items:center; gap:9px}
  .seq{font-family:var(--mono); font-size:11px; color:var(--muted-2); min-width:26px}
  .chip{font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:2px 8px; border-radius:6px; background:#183050; color:var(--text-2); border:1px solid var(--line-2)}
  .chip.em{background:rgba(16,185,129,.16); color:var(--emerald); border-color:rgba(16,185,129,.4)}
  .chip.mint{background:rgba(45,212,191,.14); color:var(--mint); border-color:rgba(45,212,191,.4)}
  .chip.blue{background:rgba(95,168,255,.14); color:#8fc0ff; border-color:rgba(95,168,255,.35)}
  .drow .title{font-size:13px; font-weight:650; color:var(--text)}
  .drow .detail{font-size:11.5px; color:var(--muted); margin-top:5px; margin-left:35px; line-height:1.5}
  .drow .h{margin-left:auto}
  .drow .refc{font-size:10px; font-weight:800; color:var(--mint); background:rgba(45,212,191,.12);
    border:1px solid rgba(45,212,191,.32); border-radius:5px; padding:1px 6px; font-family:var(--mono); flex:0 0 auto}

  /* causal tracing — every edge below is a real `refs` array in the signed ledger */
  .trace-hint{font-size:11.5px; color:var(--muted); margin:-8px 0 14px; line-height:1.5}
  .trace-hint kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--line-2); border-radius:5px;
    padding:1px 5px; background:#0b2135; color:var(--text-2)}
  .drow{cursor:default; transition:border-color .2s ease, box-shadow .2s ease, opacity .2s ease, transform .2s ease}
  .drow:hover{border-color:var(--line-2)}
  .drow:focus-visible{outline:2px solid var(--mint); outline-offset:2px}
  .stream.tracing .drow{opacity:.3}
  .stream.tracing .drow.active{opacity:1; border-color:var(--mint); transform:translateX(2px);
    box-shadow:0 0 0 1px rgba(45,212,191,.5), 0 12px 28px rgba(0,0,0,.4)}
  .stream.tracing .drow.ancestor{opacity:1; border-color:rgba(240,180,41,.55); border-left-color:var(--amber)}
  .stream.tracing .drow.ancestor .refc{color:var(--amber); border-color:rgba(240,180,41,.4); background:rgba(240,180,41,.12)}

  @media (prefers-reduced-motion: no-preference){
    /* `backwards`, not `both`: a filled end-state would out-rank the .tracing
       opacity/transform rules above and silently kill the causal highlight. */
    .drow{animation:slidein .5s cubic-bezier(.2,.7,.3,1) backwards; animation-delay:calc(var(--i,0) * 75ms)}
    @keyframes slidein{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
  }

  /* ---------- money shot ---------- */
  .money-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:22px}
  .shot{border:1px solid rgba(16,185,129,.45); border-radius:14px; padding:20px; background:linear-gradient(180deg,rgba(16,185,129,.12),rgba(15,42,67,.35))}
  .shot .lead{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--emerald); font-weight:700}
  .shot .big{font-size:26px; font-weight:800; margin:9px 0 3px; letter-spacing:-.5px}
  .shot .big .amt{background:linear-gradient(120deg,var(--emerald),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .causal{margin-top:16px; border-top:1px dashed var(--line-2); padding-top:14px}
  .causal .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:9px}
  .link-node{display:flex; align-items:center; gap:10px; font-size:12.5px; padding:7px 0; color:var(--text-2)}
  .link-node .ic{width:22px;height:22px;border-radius:6px;background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.4);display:grid;place-items:center;font-size:11px;color:var(--mint);flex:0 0 auto}
  .link-node .lh{margin-left:auto}
  .plan-card{border:1px solid var(--line); border-radius:14px; padding:20px; background:var(--panel)}
  .plan-card h3{font-size:13px; color:var(--text-2); margin-bottom:14px; font-weight:650}
  .inst{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .inst:last-child{border-bottom:0}
  .inst .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(16,185,129,.18);color:var(--emerald);border:1px solid rgba(16,185,129,.4);flex:0 0 auto}
  .inst .amt{font-weight:700; font-variant-numeric:tabular-nums}
  .inst .meta{font-size:11.5px; color:var(--muted); margin-left:auto; text-align:right}
  .inst .paid{color:var(--emerald); font-weight:700; font-size:11.5px}

  /* ---------- two column: simulator + verify ---------- */
  .two{display:grid; grid-template-columns:1.05fr .95fr; gap:22px; margin-top:26px}
  .two > section.frame{margin-top:0}
  .meter{margin:6px 0 20px}
  .meter .mtop{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .meter .pct{font-size:30px; font-weight:800; letter-spacing:-1px; background:linear-gradient(120deg,var(--emerald),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .meter .cap{font-size:12px; color:var(--muted)}
  .track{height:12px; border-radius:999px; background:#0b2135; border:1px solid var(--line); overflow:hidden}
  .fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--emerald-dim),var(--mint))}
  .simstats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px}
  .simstat{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; text-align:center}
  .simstat .v{font-size:20px; font-weight:800} .simstat .k{font-size:11px; color:var(--muted); margin-top:3px}
  .simstat.zero .v{color:var(--emerald)}
  .ptable{width:100%; border-collapse:collapse; font-size:12px}
  .ptable th{text-align:left; color:var(--muted); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; padding:7px 8px; border-bottom:1px solid var(--line)}
  .ptable td{padding:7px 8px; border-bottom:1px solid rgba(31,62,90,.5); color:var(--text-2)}
  .ptable td.r{text-align:right; font-variant-numeric:tabular-nums; font-family:var(--mono); font-size:11px}
  .state-pill{font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:6px}
  .state-pill.PAID{background:rgba(16,185,129,.16); color:var(--emerald)}
  .state-pill.OPTED_OUT{background:rgba(95,168,255,.14); color:#8fc0ff}
  .state-pill.WRITEOFF_RECOMMENDED{background:#3a2a12; color:var(--amber)}
  .state-pill.CLIENT{background:#2a2140; color:#b79bff}
  .v0{color:var(--emerald); font-weight:700}

  .merkle{border:1px solid var(--line); border-radius:10px; background:#0b2135; padding:14px 16px; margin-bottom:16px}
  .merkle .mrow{display:flex; gap:12px; align-items:baseline; padding:5px 0; font-family:var(--mono); font-size:11px}
  .merkle .mrow .d{color:var(--mint); min-width:92px} .merkle .mrow .rt{color:var(--muted); word-break:break-all}
  .cmd{display:flex; align-items:center; gap:10px; background:#07131f; border:1px solid var(--line-2); border-radius:9px; padding:11px 14px; font-family:var(--mono); font-size:13px; color:var(--text); min-width:0}
  .cmd .p{color:var(--emerald); flex:0 0 auto}
  .cmd .ct{min-width:0; overflow-wrap:anywhere}
  .copybtn{margin-left:auto; flex:0 0 auto; font-family:var(--sans); font-size:11.5px; font-weight:700; color:var(--text-2);
    background:rgba(45,212,191,.09); border:1px solid var(--line-2); border-radius:7px; padding:5px 10px; cursor:pointer;
    transition:color .16s ease, border-color .16s ease, background .16s ease, transform .16s ease}
  .copybtn:hover{color:var(--mint); border-color:rgba(45,212,191,.55); background:rgba(45,212,191,.18)}
  .copybtn:focus-visible{outline:2px solid var(--mint); outline-offset:2px; color:var(--mint)}
  .copybtn:active{transform:scale(.95)}
  .copybtn.done{color:var(--emerald); border-color:rgba(16,185,129,.5); background:rgba(16,185,129,.14)}
  .vnote{font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.55}
  .vnote b{color:var(--text-2)}
  .vkpi{display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap}
  .vkpi div{font-size:12px; color:var(--muted)} .vkpi div b{display:block; font-size:17px; color:var(--text); font-family:var(--mono); margin-top:2px}
  .vkpi div.ok b{color:var(--emerald)}

  footer{margin-top:34px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted-2); font-size:12px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between}

<script>
(function(){
  "use strict";
  var DATA = {};

  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){

      '<div class="fnav">'+ NAV.map(function(n){ return '<a href="'+n[0]+'">'+esc(n[1])+'</a>'; }).join('') +'</div></div>'+
      '<div class="fmeta"><a class="repo-link" href="https://github.com/edycutjong/recoup">Source &amp; how to re-verify &#8599;</a>'+
        '<span class="mono" style="color:var(--muted-2)">exported '+esc((DATA.generatedAtIso||'').slice(0,19).replace('T',' '))+'Z</span></div>'+
    '</footer>';

  el('app').innerHTML = nav + '<a id="top"></a>' + header + counters + gates + split + money +
    '<div class="two">'+simulator+verify+'</div>' + footer;

  // ==================== behaviour ====================
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // --- causal tracing: walk the real `refs` arrays backwards through the chain
  var stream = document.querySelector('#ledger .stream');
  var rowByHash = {};
  if(stream){
    [].forEach.call(stream.querySelectorAll('.drow'), function(r){ rowByHash[r.getAttribute('data-hash')] = r; });

    var clearTrace = function(){
      stream.classList.remove('tracing');
      [].forEach.call(stream.querySelectorAll('.drow'), function(r){ r.classList.remove('active','ancestor'); });
    };
    var trace = function(row){
      var hash = row.getAttribute('data-hash');
      var seen = {}, queue = ((byHash[hash]||{}).refs||[]).slice();
      while(queue.length){
        var h = queue.shift();
        if(seen[h]) continue;
        seen[h] = 1;
        var parent = byHash[h];
        if(parent && parent.refs) queue = queue.concat(parent.refs);
      }
      if(!Object.keys(seen).length) return;           // nothing to trace — leave the view alone
      clearTrace();
      stream.classList.add('tracing');
      row.classList.add('active');
      Object.keys(seen).forEach(function(h){ if(rowByHash[h]) rowByHash[h].classList.add('ancestor'); });
    };
    stream.addEventListener('mouseover', function(e){
      var r = e.target.closest && e.target.closest('.drow'); if(r) trace(r); });
    // mouseleave alone is unreliable when the pointer jumps out in one step,
    // so clear on any mouseout whose relatedTarget is outside the stream.
    stream.addEventListener('mouseleave', clearTrace);
    stream.addEventListener('mouseout', function(e){
      if(!e.relatedTarget || !stream.contains(e.relatedTarget)) clearTrace(); });
    stream.addEventListener('focusin', function(e){
      var r = e.target.closest && e.target.closest('.drow'); if(r) trace(r); });
    stream.addEventListener('focusout', clearTrace);
  }

  // --- copy the verify command
  var copyBtn = el('copy-cmd');
  if(copyBtn){
    copyBtn.addEventListener('click', function(){
      var text = copyBtn.getAttribute('data-cmd') || '';
      var done = function(){ copyBtn.textContent='Copied'; copyBtn.classList.add('done');
        setTimeout(function(){ copyBtn.textContent='Copy'; copyBtn.classList.remove('done'); }, 1600); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, done); }
      else {
        var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); done();
      }
    });
  }

  // --- count-up + scroll reveal (both no-ops without IntersectionObserver)
  function animateCount(node){
    var to = parseFloat(node.getAttribute('data-to'))||0, fmt = node.getAttribute('data-fmt')||'int';
    if(reduced || to === 0){ node.textContent = fmtNum(to,fmt); return; }
    var dur = 1000, t0 = null;
    var step = function(ts){
      if(t0===null) t0 = ts;
      var p = Math.min(1,(ts-t0)/dur), e = 1-Math.pow(1-p,3);
      node.textContent = fmtNum(to*e, fmt);
      if(p<1) requestAnimationFrame(step); else node.textContent = fmtNum(to,fmt);
    };
    requestAnimationFrame(step);
  }

  if(window.IntersectionObserver){
    var countObs = new IntersectionObserver(function(entries,obs){
      entries.forEach(function(en){ if(en.isIntersecting){ animateCount(en.target); obs.unobserve(en.target); } });
    }, {threshold:.4});
    [].forEach.call(document.querySelectorAll('.cu'), function(n){ countObs.observe(n); });

    if(!reduced){
      var targets = document.querySelectorAll('#counters, #gates, #splitscreen, #moneyshot, .two');
      [].forEach.call(targets, function(n){ n.classList.add('reveal'); });
      var revObs = new IntersectionObserver(function(entries,obs){
        entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); obs.unobserve(en.target); } });
      }, {threshold:.06, rootMargin:'0px 0px -40px 0px'});
      [].forEach.call(targets, function(n){ revObs.observe(n); });
      // failsafe: never leave content hidden if the observer never fires
      setTimeout(function(){ [].forEach.call(targets, function(n){ n.classList.add('in'); }); }, 2500);
    }

    // fill the recovery meter from 0 once it scrolls in
    var fill = el('sim-fill');
    if(fill && !reduced){
      var target = fill.style.width;
      fill.style.width = '0%'; fill.style.transition = 'width 1.1s cubic-bezier(.2,.7,.3,1)';
      new IntersectionObserver(function(entries,obs){
        entries.forEach(function(en){ if(en.isIntersecting){ fill.style.width = target; obs.unobserve(en.target); } });
      }, {threshold:.5}).observe(fill.parentNode);
    }
  }
})();
</script>
</body>
